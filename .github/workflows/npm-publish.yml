name: Publish npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Release tag to validate, for example v1.8.11
        required: false
      dryRun:
        description: Validate the publish path without uploading to npm
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      prerelease:
        description: Publish with the next dist-tag instead of latest
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish amplitude-rn-experiment
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.releaseTag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.releaseTag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate npm trusted publishing toolchain
        run: |
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)"
          npm -v | node -e "const version = require('fs').readFileSync(0, 'utf8').trim().split('.').map(Number); if (version[0] < 11 || (version[0] === 11 && version[1] < 5) || (version[0] === 11 && version[1] === 5 && version[2] < 1)) process.exit(1)"

      - name: Setup Bun
        run: npm install -g bun@1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version
        run: |
          set -euo pipefail

          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.releaseTag }}"

          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$PACKAGE_VERSION"
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"

          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Release tag v$RELEASE_VERSION does not match $PACKAGE_NAME@$PACKAGE_VERSION"
            exit 1
          fi

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "PACKAGE_ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"

            if [ "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dryRun == 'true' }}" = "true" ]; then
              echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; continuing because this is a dry run"
            else
              echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published"
              exit 1
            fi
          else
            echo "PACKAGE_ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
          fi

      - name: Select npm dist-tag
        run: |
          if [ "${{ github.event_name == 'release' && github.event.release.prerelease || github.event.inputs.prerelease }}" = "true" ]; then
            echo "NPM_DIST_TAG=next" >> "$GITHUB_ENV"
          else
            echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Verify package
        run: |
          bun run typescript
          bun run lint
          bun run test

      - name: Publish package
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dryRun == 'true' }}" = "true" ]; then
            if [ "$PACKAGE_ALREADY_PUBLISHED" = "true" ]; then
              bun pm pack --dry-run
            else
              npm publish --access public --tag "$NPM_DIST_TAG" --dry-run
            fi
          else
            npm publish --access public --tag "$NPM_DIST_TAG"
          fi
